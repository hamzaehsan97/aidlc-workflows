name: Company SaaS extension
on:
  pull_request:
    paths:
      - 'company/**'
      - 'plugins/company-saas/**'
      - 'core/**'
      - 'harness/**'
      - 'scripts/**'
      - 'tests/harness/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/company-saas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun scripts/package.ts
      - run: bun core/tools/aidlc-plugin-validate.ts plugins/company-saas
      - run: bun test plugins/company-saas/tests/plugin.test.ts
      - run: bun x biome check --error-on-warnings company plugins/company-saas
